{% extends "session/basic_session.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
  <div class="mb-4">
    <p class="eyebrow mb-1">UniDesk</p>
    <h1 class="h3 mb-1">Escolha uma nova senha</h1>
    <p class="text-muted mb-0">Digite e confirme a nova senha.</p>
  </div>
  <div id="resetMessage" class="alert d-none" role="status" aria-live="polite"></div>
  <form id="resetPasswordForm" class="needs-validation" novalidate>
    <div class="mb-3">
      <label class="form-label" for="newPassword">Nova senha</label>
      <input class="form-control" id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <div class="invalid-feedback">Insira ao menos 6 caracteres.</div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="confirmPassword">Confirme a nova senha</label>
      <input class="form-control" id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <div class="invalid-feedback">As senhas devem ser iguais.</div>
    </div>
    <button id="resetPasswordButton" class="btn btn-primary w-100" type="submit">Mudar a senha</button>
  </form>
  <div class="auth-footer"><a href="{{ url_for('login') }}">Volta à página de login</a></div>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const recoveryType = params.get("type");
      const form = document.getElementById("resetPasswordForm");
      const message = document.getElementById("resetMessage");
      const button = document.getElementById("resetPasswordButton");
      const password = document.getElementById("newPassword");
      const confirmation = document.getElementById("confirmPassword");

      window.history.replaceState({}, document.title, window.location.pathname + window.location.search);

      const showMessage = (text, type) => {
        message.textContent = text;
        message.className = `alert alert-${type}`;
      };

      if (!form || !message || !button || !password || !confirmation) {
        return;
      }

      if (!accessToken || !refreshToken || recoveryType !== "recovery") {
        form.hidden = true;
        showMessage("Este link para redefinição é inválido ou expirou. Solicite um novo.", "danger");
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        confirmation.setCustomValidity(password.value === confirmation.value ? "" : "Senhas não conferem.");
        if (!form.reportValidity()) {
          return;
        }

        button.disabled = true;
        try {
          const response = await fetch("{{ url_for('reset_password') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              access_token: accessToken,
              refresh_token: refreshToken,
              password: password.value
            })
          });
          const result = await response.json();
          if (!response.ok) {
            showMessage(result.error || "A senha não pôde ser alterada.", "danger");
            button.disabled = false;
            return;
          }

          form.hidden = true;
          showMessage("Sua senha foi alterada. Você já pode iniciar sessão.", "success");
        } catch {
          showMessage("Não foi possível conectar ao servidor. Tente novamente!", "danger");
          button.disabled = false;
        }
      });
    })();
  </script>
{% endblock content %}
