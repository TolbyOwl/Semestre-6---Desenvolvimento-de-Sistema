<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminHMD authentication page">
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="static\css\bootstrap.min.css">
  <link rel="stylesheet" href="static\vendors\bootstrap-icons\bootstrap-icons.css">
  <link rel="stylesheet" href="static\css\style.css">
</head>
<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>

  <main class="auth-page">
    <section class="auth-card">
      <!-- <a class="auth-brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>adminHMD</strong><small>Sign in to your admin workspace.</small></span></a> -->
      <div class="auth-visual"><img src="static\images\png\dasher-ui-bootstrap-5.jpg" alt="adminHMD dashboard interface"></div>
      {% block content %}
      {% endblock content %}
    </section>
  </main>
  <script src="static\js\bootstrap.bundle.min.js"></script>
  <script src="static\js\main.js"></script>
</body>
</html>
