{% extends "it_dash/basic_dash.html" %} {% block title %} Forms{% endblock %} {%
block content %}

<div class="container-fluid px-3 px-lg-4 py-4">
  <div class="page-heading">
    <div class="page-heading-for-forms">
      <span class="page-icon"
        ><i class="bi bi-ui-checks-grid" aria-hidden="true"></i
      ></span>
      <div class="col-md-12">
        <h1 class="h3 mb-1">
          <input
            class="form-subject"
            id="titleTicket"
            name="subject"
            form="ticketForm"
            placeholder="Título da solicitação"
            required
          />
        </h1>
      </div>
    </div>
  </div>

  <section class="row g-3">
    <div class="col-12">
      <form id="ticketForm" class="panel needs-validation" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="formName">Nome completo</label
            ><input class="form-control" id="formName" name="name" value="{% if user_name %}{{ user_name }}{% endif %}" required />
            <div class="invalid-feedback">Nome completo requerido.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="formEmail">Email</label
            ><input
              class="form-control"
              id="formEmail"
              type="email"
              name="email"
              value="{% if user_email %}{{ user_email }}{% endif %}"
              required
            />
            <div class="invalid-feedback">Insira um email valido.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="formPlan">Solicitação</label
            ><select
              class="form-select"
              id="formPlan"
              name="ticket_type"
              required
            >
              <option value="" disabled selected>Selecione uma opção</option>
              <option>Incidente</option>
              <option>Solicitação</option>
              <option>Monitoramento</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="formPriority">Prioridade</label>
            <select
              class="form-select"
              id="formPriority"
              name="priority"
              required
            >
              <option value="" disabled selected>Selecione uma opção</option>
              <option>Baixa</option>
              <option>Normal</option>
              <option>Serviço instável</option>
              <option>Urgente</option>
            </select>

            <div class="invalid-feedback">Selecione uma prioridade.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="formMessage">Descrição</label
            ><textarea
              class="form-control"
              id="formMessage"
              rows="5"
              required
              name="description"
            ></textarea>
            <div class="invalid-feedback">Descrição requerida.</div>
          </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-send" aria-hidden="true"></i> Submit Form
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock content %}
