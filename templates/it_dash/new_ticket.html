{% extends "it_dash/basic_dash.html" %} {% block title %} Forms{% endblock %} {%
block content %}

<div class="container-fluid px-3 px-lg-4 py-4">
  <div class="page-heading">
    <div class="page-heading-copy">
      <span class="page-icon"
        ><i class="bi bi-ui-checks-grid" aria-hidden="true"></i
      ></span>
      <div>
        <h1 class="h3 mb-1">Novo Ticket</h1>
        <p class="text-muted mb-0">xxxxxxxxxxxxxxxxxxxxx.</p>
      </div>
    </div>
  </div>

  <section class="row g-3">
    <div class="col-12">
      <form class="panel needs-validation" method="post">
        <div class="panel-header">
          <div>
            <h2 class="h5 mb-1 section-title">
              <i class="bi bi-ui-checks-grid" aria-hidden="true"></i
              ><span><input class="form-control" id="titleTicket" name="subject" placeholder="Título da solicitação" required /></span>
            </h2>
          </div>
        </div>
         <!-- <div class="col-md-12">
            <label class="form-label" for="titleTicket">Titulo do chamado</label
            ><input class="form-control" id="titleTicket" name="subject" required />
            <div class="invalid-feedback">Titulo do chamado requerido.</div>
          </div> -->
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="formName">Nome completo</label
            ><input class="form-control" id="formName" name="name" required />
            <div class="invalid-feedback">Nome completo requerido.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="formEmail">Email</label
            ><input class="form-control" id="formEmail" type="email" name="email" required />
            <div class="invalid-feedback">Insira um email valido.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="formPlan">Solicitação</label
            ><select class="form-select" id="formPlan" name="ticket_type" required>
              <option value="">Solicitação</option>
              <option>Incidente</option>
              <option>Solicitação</option>
              <option>Monitoramento</option>
            </select>
            <!-- <div class="invalid-feedback">Choose a plan.</div> -->
          </div>
          <div class="col-md-6">
            <label class="form-label" for="formPriority">Prioridade</label>
            <select class="form-select" id="formPriority" name="priority" required>
              <option value="">Prioridade</option>
              <option>Baixa</option>
              <option>Normal</option>
              <option>Serviço intavel</option>
              <option>Urgente</option>
            </select>

            <div class="invalid-feedback">Selecione uma prioridade.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="formMessage">Descrição</label
            ><textarea
              class="form-control"
              id="formMessage"
              rows="5"
              required
              name="description"
            ></textarea>
            <div class="invalid-feedback">Descrição requerida.</div>
          </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-send" aria-hidden="true"></i> Submit Form
          </button>
        </div>
      </form>
    </div>
    <div class="col-12 col-xl-5">
      <!-- <div class="panel h-100">
        <h2 class="h5 mb-3 section-title">
          <i class="bi bi-input-cursor-text" aria-hidden="true"></i
          ><span>Input States</span>
        </h2>
        <input class="form-control mb-3" value="Default input" /><input
          class="form-control is-valid mb-3"
          value="Valid input"
        /><input class="form-control is-invalid mb-3" value="Invalid input" />
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="sampleCheck"
            checked
          /><label class="form-check-label" for="sampleCheck"
            >Sample checkbox</label
          >
        </div>
      </div> -->
    </div>
  </section>
</div>
{% endblock content %}
