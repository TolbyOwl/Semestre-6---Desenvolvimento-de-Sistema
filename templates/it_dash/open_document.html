{% extends "it_dash/basic_dash.html" %} 
{% block title %} Novo documento {% endblock %} 
{% block content %}
<div class="container-fluid px-3 px-lg-4 py-4">
  <div class="page-heading">
    <div class="page-heading-for-forms">
      <span class="page-icon"
        ><i class="bi bi-ui-checks-grid" aria-hidden="true"></i
      ></span>
      <div class="col-md-12">
        <h1 class="h3 mb-1">
          <input
            class="form-subject"
            id="titleTicket"
            name="subject"
            form="ticketForm"
            value="{{ document.subject }}"
            disabled
            required
          />
        </h1>
        <!-- <p class="text-muted mb-0">xxxxxxxxxxxxxxxxxxxxx.</p> -->
      </div>
    </div>
  </div>

  <form id="deleteDocumentForm" action="{{ url_for('delete_document', id=document.id) }}" method="post"></form>

  <section class="row g-3">
    <div class="col-12">
      <form id="ticketForm" class="panel needs-validation" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="Tag">Tag</label
            ><input class="form-control" id="tag" name="tag" value="{{ document.tag }}" disabled required/>
            <div class="invalid-feedback">Nome completo requerido.</div>
          </div>
          <div class="col-12">
            <textarea id="summernote" name="editordata">{{ document.content }}</textarea>
            <!-- <div class="invalid-feedback">Descrição requerida.</div> -->
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button class="btn btn-primary d-none bg-danger" id="deleteButton" type="submit" form="deleteDocumentForm">
            <i class="bi bi-trash" aria-hidden="true"></i> Excluir
          </button>
          <button class="btn btn-primary" id="editButton" type="button">
            Editar
          </button>
          <button class="btn btn-primary d-none" id="submitButton" type="submit">
            <i class="bi bi-send" aria-hidden="true"></i> Salvar
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock content %}
